[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-banking-api"
version = "0.1.0"
description = "A layered FastAPI port of the Java Banking API playground"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1,<1",
    "pydantic[email]>=2.12.5,<3",
    "simplejson>=3.20,<4",
    "uvicorn>=0.42,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

